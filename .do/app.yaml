# DigitalOcean App Platform spec for the arcadian-eu app.
# Corporate source: arcadian-spzoo.ghe.com/Arcadian-EU/arcadian-eu-deploy.
# The company-owned GitHub.com publication repository supplies App Platform.
# Its deploy workflow applies this spec after checks pass.
#
# The contact form posts straight to https://werfvolt.be/api/public/leads/form.
# This app has no server function or secret; its public Turnstile sitekey is
# injected into the four localized homepages and Dutch facade form during the build.
name: arcadian-eu
region: fra
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
# NB: keep this spec structurally identical to the live app — the CI token has
# app read/update only, and DigitalOcean 403s a spec that adds or removes
# components (do such changes once in the console, then mirror them here).
domains:
  - domain: arcadian-eu.com
    type: PRIMARY
  - domain: www.arcadian-eu.com
    type: ALIAS
ingress:
  rules:
    - component:
        name: arcadian-landing
      match:
        path:
          prefix: /
static_sites:
  - name: arcadian-landing
    environment_slug: html
    git:
      repo_clone_url: https://github.com/Arcadian-EU/arcadian-eu-deploy.git
      branch: main
    source_dir: static-site
    build_command: sh ./build-turnstile-site.sh
    output_dir: dist
    envs:
      - key: TURNSTILE_SITEKEY
        scope: BUILD_TIME
        type: GENERAL
        value: __TURNSTILE_SITEKEY__
      - key: CMS_PUBLIC_URL
        scope: BUILD_TIME
        type: GENERAL
        value: __CMS_PUBLIC_URL__
      - key: SOURCE_COMMIT
        scope: BUILD_TIME
        type: GENERAL
        value: __SOURCE_COMMIT__
    index_document: index.html
    # No catchall: unknown paths must be real 404s (with catchall every URL answered
    # 200 with the homepage — soft-404 duplicates for search engines).
    error_document: 404.html
